[project]
name = "electronic-store"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "pydentic (>=0.0.1.dev3,<0.0.2)",
    "pytest (>=9.1.1,<10.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "bcrypt (==4.0.1)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pydantic[email] (>=2.14.1,<3.0.0)",
]

[tool.poetry]
packages = [{include = "electronic_store", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
